DESIGN_NAME: sky130_top
CLOCK_PORT: clk
CLOCK_PERIOD: 40

VERILOG_FILES:
- dir::../rtl/riscv/*.v
- dir::../rtl/sky130/sky130_top.v

VERILOG_DEFINES:
- ASIC

VERILOG_INCLUDE_DIRS:
- dir::../rtl/include

DEFAULT_CORNER: nom_ss_100C_1v60

PNR_SDC_FILE: dir::pnr.sdc
SIGNOFF_SDC_FILE: dir::signoff.sdc

SYNTH_STRATEGY: "DELAY 0"
SYNTH_SIZING: true
# SYNTH_AUTONAME: true

FP_SIZING: "absolute"
DIE_AREA: [ 0, 0, 750, 550 ]
CORE_AREA: [ 25, 25, 725, 525 ]

IO_PIN_ORDER_CFG: dir::pin_order.cfg

PL_RESIZER_SETUP_SLACK_MARGIN: 4
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1

PDN_CORE_RING: true
PDN_CONNECT_MACROS_TO_GRID: true

VDD_NETS:
- vccd1
GND_NETS:
- vssd1

PDN_MACRO_CONNECTIONS:
- "riscv.reg_file.reg_file vccd1 vssd1 VPWR VGND"

